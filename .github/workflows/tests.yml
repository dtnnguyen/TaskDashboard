# Tests on macOS, Ubuntu and Windows. Runs only when code changes (macOS minutes cost
# 10x on private repos), and before every release (release.yml calls it).
name: Tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "macos/**"
      - "linux/**"
      - "windows/**"
      - "scripts/**"
      - "examples/**"
      - "td"
      - "td.cmd"
      - "pyproject.toml"
      - ".github/workflows/tests.yml"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"   # oldest supported: the macOS system Python SwiftBar uses
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install the Windows tray icon's libraries (so its icon test runs)
        if: runner.os == 'Windows'
        run: python -m pip install -r windows/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build release packages (dry run)
        run: python scripts/package.py --out dist
